name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: go test -race
        run: go test -race ./...

  engine-linux:
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache
    steps:
      - uses: actions/checkout@v4
      # The test clips are in Git LFS; cache them so CI doesn't spend LFS bandwidth on every run.
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-ids
      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
      - name: Fetch the test clips
        run: git lfs pull
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build nasm pkg-config autoconf autoconf-archive automake libtool
      - name: Read vcpkg baseline
        id: baseline
        run: echo "sha=$(jq -r '."builtin-baseline"' engine/vcpkg.json)" >> "$GITHUB_OUTPUT"
      - name: Set up vcpkg at the manifest baseline
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout ${{ steps.baseline.outputs.sha }}
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-linux-${{ hashFiles('engine/vcpkg.json') }}
          restore-keys: vcpkg-linux-
      - name: Configure
        working-directory: engine
        run: cmake --preset ci-linux
      - name: Build
        working-directory: engine
        run: cmake --build --preset ci-linux
      - name: Test
        working-directory: engine
        run: ctest --preset ci-linux

  # Windows runners cost 2x minutes on a private repo, so this job runs only when triggered by hand.
  engine-windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
    steps:
      - uses: actions/checkout@v4
      - name: List LFS objects
        shell: bash
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-ids
      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
      - name: Fetch the test clips
        run: git lfs pull
      - name: Set up vcpkg at the manifest baseline
        shell: pwsh
        run: |
          $sha = (Get-Content engine/vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          git clone https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout $sha
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - name: Find Visual Studio
        id: vs
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | ConvertFrom-Json
          $major = $vs.installationVersion.Split('.')[0]
          # The generator's exact name comes from CMake: vswhere's product line isn't always the year.
          $m = cmake --help | Select-String "^\*?\s*(Visual Studio $major \d{4})\s*=" | Select-Object -First 1
          if (-not $m) { throw "CMake has no generator for Visual Studio $major ($($vs.installationVersion))" }
          $generator = $m.Matches[0].Groups[1].Value
          "$generator ($($vs.installationVersion))"
          "generator=$generator" >> $env:GITHUB_OUTPUT
          "version=$($vs.installationVersion)" >> $env:GITHUB_OUTPUT
      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-windows-${{ steps.vs.outputs.version }}-${{ hashFiles('engine/vcpkg.json') }}
          restore-keys: |
            vcpkg-windows-${{ steps.vs.outputs.version }}-
            vcpkg-windows-
      - name: Configure, build, test
        working-directory: engine
        # The presets name VS 2022; use whichever Visual Studio the runner image has.
        run: |
          cmake --preset dev -G "${{ steps.vs.outputs.generator }}"
          if ($LASTEXITCODE) { exit 1 }
          cmake --build --preset dev
          if ($LASTEXITCODE) { exit 1 }
          ctest --preset dev
      - name: Save vcpkg binaries
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
